{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <h2>{{ post.title }}</h2>
    <p><small>by {{ post.author.username }} on {{ post.created_at.strftime("%d %b %Y") }}</small></p>
    <div style="white-space: pre-wrap;">{{ post.body }}</div>
    <hr>
    <p><a href="{{ url_for('main.home') }}">&larr; Back to all posts</a></p>
{% endblock %}
