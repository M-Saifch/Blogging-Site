{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
    <h2>Latest Posts</h2>
    {% for post in posts %}
        <h3>{{ post.title }}</h3>
        <p><small>by {{ post.author.username }} on {{ post.created_at.strftime("%d %b %Y") }}</small></p>
        <p>{{ post.body }}</p>
    {% else %}
        <p>No posts yet.</p>
    {% endfor %}
{% endblock %}
