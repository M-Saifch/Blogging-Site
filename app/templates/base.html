<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog Platform{% endblock %}</title>
</head>
<body>
    <h1><a href="{{ url_for('main.home') }}">My Blog Platform</a></h1>
        <nav>
        <a href="{{ url_for('main.home') }}">Home</a>
        {% if current_user.is_authenticated %}
            | <a href="{{ url_for('posts.new') }}">New Post</a>
            | <span>Logged in as <strong>{{ current_user.username }}</strong></span>
            <form method="POST" action="{{ url_for('auth.logout') }}" style="display: inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">Logout</button>
            </form>
        {% else %}
            | <a href="{{ url_for('auth.login') }}">Login</a>
            | <a href="{{ url_for('auth.register') }}">Register</a>
        {% endif %}
    </nav>
    <hr>

    {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="flash {{ category }}"><strong>{{ message }}</strong></p>
    {% endfor %}

    {% block content %}{% endblock %}
</body>
</html>
